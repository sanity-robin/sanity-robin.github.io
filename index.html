<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06070b">
  <title>NEON PULSE LAB</title>
  <link rel="stylesheet" href="css/style.css">
  <style>.canvas-wrap:before{content:"リアルタイム解析"}</style>
</head>
<body>
  <div class="noise"></div>
  <header class="topbar">
    <div>
      <p class="eyebrow">オリジナル電子効果音ジェネレーター</p>
      <h1>NEON <span>PULSE</span> LAB</h1>
    </div>
    <div class="status"><i></i><span id="statusText">システム準備完了</span></div>
  </header>

  <main>
    <section class="panel preset-panel">
      <div class="section-head">
        <div><span class="index">01</span><h2>プリセット</h2></div>
        <p>100% オリジナル音声合成</p>
      </div>
      <div id="presetGrid" class="preset-grid"></div>
    </section>

    <section class="workspace">
      <div class="left-stack">
        <section class="panel scope-panel">
          <div class="scope-head">
            <div><span class="index">02</span><h2>ライブスコープ</h2></div>
            <div class="segmented"><button class="active" data-view="waveform">波形</button><button data-view="spectrum">スペクトラム</button></div>
          </div>
          <div class="canvas-wrap"><canvas id="scope"></canvas><div class="scanline"></div></div>
          <div class="timeline"><span>0.0s</span><span>1.0s</span><span>2.0s</span><span>3.0s</span></div>
        </section>

        <section class="panel lab-panel">
          <div class="section-head">
            <div><span class="index">03</span><h2>サウンドラボ</h2></div>
            <p id="editingLabel">レイヤー 01 を編集中</p>
          </div>
          <div id="editor" class="editor-grid"></div>
        </section>
      </div>

      <aside class="panel layers-panel">
        <div class="section-head">
          <div><span class="index">04</span><h2>レイヤー</h2></div>
          <button id="addLayer" class="icon-btn" title="レイヤー追加">＋</button>
        </div>
        <div id="layerList" class="layer-list"></div>
      </aside>
    </section>

    <section class="panel sequence-panel">
      <div class="section-head">
        <div><span class="index">05</span><h2>シーケンス</h2></div>
        <p>開始位置 / 0〜3秒</p>
      </div>
      <div id="sequenceTracks" class="sequence-tracks"></div>
    </section>
  </main>

  <footer class="transport">
    <div class="transport-main">
      <button id="playBtn" class="play"><span>▶</span> 再生</button>
      <button id="stopBtn" class="stop">■ 停止</button>
      <label class="loop-toggle"><input id="loopToggle" type="checkbox"><span></span> 連続試聴</label>
    </div>
    <div class="random-group">
      <select id="randomCategory" aria-label="ランダムカテゴリ">
        <option value="Alert">警報</option><option value="Premium">プレミアム</option><option value="Impact">衝撃</option><option value="Bass">重低音</option><option value="Freeze">フリーズ</option><option value="Rush">高速連打</option><option value="Cyber">サイバー</option><option value="Retro">レトロ</option><option value="Horror">ホラー</option>
      </select>
      <button id="randomBtn">⤨ ランダム</button>
      <button id="regenerateBtn">↻ 再生成</button>
    </div>
    <div class="file-group">
      <button id="undoBtn" title="元に戻す (Ctrl+Z)">↶</button><button id="redoBtn" title="やり直す (Ctrl+Y)">↷</button>
      <button id="exportPreset">プリセット保存</button><button id="importPreset">プリセット読込</button>
      <input id="presetFile" type="file" accept="application/json,.json" hidden>
      <button id="exportWav" class="export">⇩ WAV保存</button>
    </div>
  </footer>

  <div id="toast" class="toast"></div>
  <script src="js/presets.js"></script>
  <script src="js/audioEngine.js"></script>
  <script src="js/wavExporter.js"></script>
  <script src="js/visualizer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
